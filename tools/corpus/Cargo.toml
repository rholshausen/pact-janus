[package]
name = "pact_janus_corpus"
description = "Golden-corpus runner (plan task 3.7, plan-grammar spec §6): compiles, executes and renders every case under corpora/, checking plan.txt/executed.txt snapshots and asserting each case's result"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "corpus"
path = "src/main.rs"

[dependencies]
pact_janus_kernel = { path = "../../engine/kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
