[package]
name = "pact_janus_corpus"
description = "Golden-corpus runner (plan task 3.7, plan-grammar spec §6): compiles, executes and renders every case under corpora/, checking plan.txt/executed.txt snapshots and asserting each case's result"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "corpus"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
pact_janus_kernel = { path = "../../engine/kernel" }
pact_janus_component_json = { path = "../../engine/component-json" }
# The HTTP component's matcher, so a case can reach `http:status-class` (ADR 0057).
pact_janus_component_http = { path = "../../engine/component-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
