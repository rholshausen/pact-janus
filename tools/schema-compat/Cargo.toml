[package]
name = "pact_janus_schema_compat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CI checker enforcing the Engine Protocol's open-world schema rules (spec §2.2) and additive-evolution policy (spec §11.2)"

[[bin]]
name = "schema-compat"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
# Validates the spec's worked-example frames against the schemas. No default
# features: remote $ref resolution (and its reqwest tree) must stay off —
# spec §2.2 rule 6.
jsonschema = { version = "0.51", default-features = false }

[lints]
workspace = true
