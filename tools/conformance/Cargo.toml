[package]
name = "pact_janus_conformance"
description = "The SDK conformance suite's checker (plan task 6.4, ADR 0017): lints the cases under conformance/ against their schema and the behavioural specification's conformance ids, and checks an SDK's run report against the corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# The case schema is checked like every other schema this repo ships. No default features: remote
# $ref resolution (and its reqwest tree) stays off, as engine-protocol spec §2.2 rule 6 requires.
jsonschema = { version = "0.51", default-features = false }

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
