[package]
name = "pact_janus_bindings"
description = "Binding-generation pipeline (plan task 6.1): normalises the spec schemas an SDK is built from into one standalone schema per type, drives the per-language generators, and renders each schema's open vocabularies as constants"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "janus-bindings"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a schema's members are generated in the order its author wrote them (ADR 0037).
# Spelled here, not inherited: this crate does not depend on the kernel, so whether Cargo turned it
# on would depend on what else was built alongside it, and the release builds janus-sdk-gates with
# the CLI — its bindings would differ from the ones `cargo run -p pact_janus_bindings` checked in.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
expectest = "0.12"
pretty_assertions = "1"
rstest = "0.28"

[lints]
workspace = true
