[package]
name = "pact_janus_sdk_gates"
description = "The gates an SDK's CI runs, as one binary a release ships (staged plan S0.11): conformance, thinness and bindings, against this repository or an unpacked janus-spec.tar.gz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "janus-sdk-gates"
path = "src/main.rs"

[dependencies]
pact_janus_bindings = { path = "../bindings" }
pact_janus_conformance = { path = "../conformance" }
pact_janus_thinness = { path = "../thinness" }

[lints]
workspace = true
