[package]
name = "pact_janus_verifier_diff"
description = "The differential verification harness (staged plan S1.1): today's verifier and janus verify on the same pacts against the same provider, compared interaction by interaction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "verifier-diff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads every v1-v4 pact the way today's verifier does, and writes the compatibility suite's pacts
# the way its own harness does. Already the kernel's dependency.
pact_models = "1.3"
# The scripted provider: the same blocking server the HTTP component and the sample provider use.
tiny_http = "0.12"
base64 = "0.22"
# The body type pact_models builds interactions with.
bytes = "1"
# The one real provider in the corpus, started in this process.
pact_janus_sample_order_service = { path = "../../samples/order-service" }
# The broker cases: seeding the broker, and the recording proxy in front of it. Already in the tree.
ureq = "3"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"

[lints]
workspace = true
