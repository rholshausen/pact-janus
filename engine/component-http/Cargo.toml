[package]
name = "pact_janus_component_http"
description = "The built-in HTTP transport component (component-interfaces spec §5): a real mock HTTP server in the serve role (plan task 4.2) and a real HTTP client in the drive role (plan task 5.1), both behind the transport interface, native binding; and its matchers (http:path, http:media-type, http:list, http:status-class), which build without the transport feature for the engine's WASM component."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The transport half: the serve role's server and the drive role's client. Without it the crate is
# the matcher half alone, which the engine's WASM component registers (engine/wasm, ADR 0092).
default = ["transport"]
transport = [
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:bytes",
  "dep:tokio",
  "dep:pact_janus_http_client",
  "dep:http",
  "dep:form_urlencoded",
  "dep:base64",
  "dep:tracing",
]

[dependencies]
pact_janus_kernel = { path = "../kernel" }
serde_json = "1"
# The serve role's server (ADR 0062 decision 5): hyper serving HTTP/1.1 and HTTP/2, on a
# current-thread runtime of its own per served instance. All already in the tree through reqwest.
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"], optional = true }
# The drive role's client: the engine's one HTTP client, async behind an executor seam
# (ADR 0035), and the request and response types it takes.
pact_janus_http_client = { path = "../http-client", optional = true }
http = { version = "1", optional = true }
# Query strings, both directions: decoded into the slot on the serve side, encoded from it on the
# drive side. Already in the tree through url.
form_urlencoded = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.28"

[lints]
workspace = true

# Both test the transport, which the crate has only with its `transport` feature.
[[test]]
name = "http_drive"
required-features = ["transport"]

[[test]]
name = "http_transport"
required-features = ["transport"]
