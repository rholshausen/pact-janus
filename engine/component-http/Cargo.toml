[package]
name = "pact_janus_component_http"
description = "The built-in HTTP transport component (component-interfaces spec §5): a real mock HTTP server in the serve role (plan task 4.2) and a real HTTP client in the drive role (plan task 5.1), both behind the transport interface, native binding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pact_janus_kernel = { path = "../kernel" }
# The serve role's server, blocking (recv_timeout maps directly onto poll-inbound's timeout-ms),
# until S2.1 rewrites it on the drive role's executor.
tiny_http = "0.12"
# The drive role's client: the engine's one HTTP client, async behind an executor seam
# (ADR 0035), and the request and response types it takes.
pact_janus_http_client = { path = "../http-client" }
http = "1"
serde_json = "1"
# Query strings, both directions: decoded into the slot on the serve side, encoded from it on the
# drive side. Already in the tree through url.
form_urlencoded = "1"
base64 = "0.23"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
