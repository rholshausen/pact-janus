[package]
name = "pact_janus_kernel"
description = "Pact Janus engine kernel: session lifecycle, plan compiler, plan interpreter, pact model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Kernel crates must stay buildable for wasm32-wasip2: no tokio/reqwest/native-only
# dependencies here except behind target-gated features.
pact_models = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
# The interpreter's match:regex/match:semver/bytes-literal support. Pure Rust, no OS bindings -
# pact-reference's own matching engine depends on the same three for the same reasons.
regex = "1"
semver = "1"
base64 = "0.22"
# The facade only — pure Rust, wasm-safe. A subscriber (tracing-subscriber) is an application
# concern, installed by whatever embeds the kernel (the CLI, a host process), never by this crate.
tracing = "0.1"

[dev-dependencies]
rstest = "0.24"
pretty_assertions = "1"
# No default features: remote $ref resolution (and its reqwest tree) must stay off,
# matching tools/schema-compat's config (protocol spec §2.2 rule 6).
jsonschema = { version = "0.51", default-features = false }
# `#[test_log::test]` installs a tracing subscriber for the test, reading `RUST_LOG`, so
# `RUST_LOG=debug cargo test -- --nocapture` (CLAUDE.md) has somewhere to send the kernel's own
# tracing output without every test file rolling its own init helper.
test-log = { version = "0.2", default-features = false, features = ["trace"] }

[lints]
workspace = true
