[package]
name = "pact_janus_broker_client"
description = "The Pact Broker client (staged plan S1.3, ADR 0032): the kernel's broker trait over the broker's HAL API — fetching pacts for verification, publishing results, and publishing contracts. A native host capability, registered by both native binaries, because the kernel knows no HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pact_janus_kernel = { path = "../kernel" }
serde_json = "1"
# The engine's one HTTP client (ADR 0035), configured by the descriptor's `client` options, and
# the request and response types it takes. Called from a run's own thread, which blocks on it.
pact_janus_http_client = { path = "../http-client" }
http = "1"
# Basic credentials. Already in the tree.
base64 = "0.22"
# A publication to a broker that reads compressed bodies. Already in the tree.
flate2 = "1"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
# The recording proxy's and the pact verification's own client, deliberately not the client under
# test. Already in the tree.
ureq = "3"
rstest = "0.26"
# A broker stub on a real socket, for the client's own tests. Already in the tree.
tiny_http = "0.12"
# A recording's timestamps, normalised (tests/recorded.rs). Already in the tree.
regex = "1"
# The client's own consumer pact, for the provider "Pact Broker" (tests/pact.rs, staged plan S1.3's
# third layer). Pinned to the release that reads the pact_models the kernel already uses, so a test
# dependency cannot move the engine's v1-v4 reader; no default features, so no plugin driver.
pact_consumer = { version = "=1.4.10", default-features = false }
# 1.3.15 merges a pact into the file it is written to without duplicating interactions declared out
# of order (pact-reference #550), which the scenarios in tests/pact.rs do. Only that changed from
# 1.3.14, and the kernel reads pacts without merging them.
pact_models = { version = "1.3.15", default-features = false }

[lints]
workspace = true
