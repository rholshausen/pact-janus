[package]
name = "pact_janus_broker_client"
description = "The Pact Broker client (staged plan S1.3, ADR 0032): the kernel's broker trait over the broker's HAL API — fetching pacts for verification and publishing results. A native host capability, registered by both native binaries, because the kernel knows no HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pact_janus_kernel = { path = "../kernel" }
serde_json = "1"
# Blocking, as the hooks' `http` implementation is: the client is called from a run's own thread,
# which blocks on every replayed request anyway. Already in the tree.
ureq = "3"
# Basic credentials. Already in the tree.
base64 = "0.22"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
# A broker stub on a real socket, for the client's own tests. Already in the tree.
tiny_http = "0.12"

[lints]
workspace = true
