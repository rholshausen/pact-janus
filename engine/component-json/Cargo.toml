[package]
name = "pact_janus_component_json"
description = "The built-in JSON content component (component-interfaces spec §6, plan task 4.2): decode/encode/detect for application/json, native binding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pact_janus_kernel = { path = "../kernel" }
# Same detector pact-reference already ships and validates, rather than reimplementing a byte
# sniff — kernel already depends on the same crate for the same reason (legacy_pact.rs).
pact_models = "1.3"
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
