[package]
name = "pact_janus_hooks_host"
description = "The host side of hooks (lifecycle-hooks spec §7–§8, plan task 5.3): the configuration loader, and the exec and http implementations — everything that needs a filesystem, a process or a socket, which is exactly what the kernel does not have."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pact_janus_kernel = { path = "../kernel" }
serde_json = "1"
# The authored configuration is YAML or JSON (spec §6.1). serde_yaml_ng is the maintained fork of
# the archived serde_yaml; the parsed document is a serde_json::Value either way, so nothing below
# the loader knows which form the file was in.
serde_yaml_ng = "0.10"
# A load error keeps why a file could not be read as its `source`, the error itself rather than its
# text, so a host can show the cause apart from the headline (ADR 0054, staged plan S1.33). Already
# in the tree.
thiserror = "2"
# The `http` implementation's client: the one the HTTP transport and the broker client send through
# (ADR 0035), so a state endpoint is reached as the provider is (ADR 0044).
pact_janus_http_client = { path = "../http-client" }
http = "1"
# A query-form state call's parameters, encoded (today's `--state-change-as-query`). Already in the
# tree through reqwest.
url = "2"
tracing = "0.1"
# A `pact-message` reply's `Pact-Message-Metadata` header and its contents (staged plan S1.7).
# Already in the tree through the kernel.
base64 = "0.23"

# Ends an exec hook's process group at its deadline, safely (spec §5.4). Already in the tree through
# wasmtime.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
pretty_assertions = "1"
# A provider over TLS that can demand a client certificate, for a state endpoint reached as the
# provider is (ADR 0044).
pact_janus_test_servers = { path = "../../tools/test-servers" }

[lints]
workspace = true
