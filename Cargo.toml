[workspace]
resolver = "3"
members = [
  "engine/kernel",
  "cli",
  "tools/schema-compat",
]
# Spikes are standalone projects, never workspace members. The benchmark
# harness is durable but standalone too — it drags the whole pact_ffi
# dependency tree, which the main workspace should not pay for.
exclude = ["spikes", "benchmarks"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rholshausen/pact-janus"
authors = ["Pact Janus contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
