[workspace]
resolver = "3"
members = [
  "engine/kernel",
  "engine/component-json",
  "engine/component-http",
  "engine/component-oauth2",
  "engine/hooks-host",
  "engine/broker-client",
  "engine/http-client",
  "engine/component-host",
  "engine/wasm",
  "cli",
  "samples/order-service",
  "tools/schema-compat",
  "tools/corpus",
  "tools/conformance",
  "tools/thinness",
  "tools/bindings",
  "tools/doc-links",
  "tools/engine-pin",
  "tools/sdk-gates",
  "tools/verifier-diff",
  "tools/test-servers",
]
# The benchmark harness is durable but standalone — it drags the whole
# pact_ffi dependency tree, which the main workspace should not pay for.
# Each third-party component is its own workspace, depending on nothing here.
exclude = ["benchmarks", "third-party"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rholshausen/pact-janus"
authors = ["Pact Janus contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
