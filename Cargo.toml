[workspace]
resolver = "3"
members = [
  "engine/kernel",
  "cli",
]
# Spikes are standalone projects, never workspace members.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rholshausen/pact-janus"
authors = ["Pact Janus contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
