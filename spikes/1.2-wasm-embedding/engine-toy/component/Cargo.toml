[package]
name = "toy-engine-component"
version = "0.1.0"
edition = "2021"

[dependencies]
toy-logic = { path = "../logic" }
wit-bindgen-rt = { version = "0.39", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "pact:toy-engine"

[package.metadata.component.target]
path = "wit"
world = "engine"
