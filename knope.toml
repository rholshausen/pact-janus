# How a release's version and changelog are decided (staged plan S0.4, ADR 0028): by change files,
# never by reading commit subjects. A pull request that changes what ships adds a Markdown file to
# .changeset/ saying how big the change is and what it means to someone who pins the engine;
# `knope prepare-release` turns the files that have gathered into a version and a CHANGELOG.md
# entry, and deletes them. CONTRIBUTING.md has the how-to.
#
# knope is pinned where CI runs it (.github/workflows/); use the same version here.

# Three packages, each released on its own (ADR 0060 decision 2); a change file names the ones it
# moves, and one change may move several.
#
# `engine`: the Rust workspace. Its one version is `[workspace.package]`'s in the root Cargo.toml —
# what `engine/hello` and `janus version` report, and what every artifact of its release carries.
# Tagged `v<version>` by release.yml.
[packages.engine]
versioned_files = ["Cargo.toml"]
changelog = "CHANGELOG.md"

# `typescript-sdk` and `jvm-sdk`: the SDKs, released as files on GitHub releases of their own until
# they graduate (S2.9). Tagged `<package>/v<version>` by release-sdks.yml. Neither version says
# anything about the engine's: the engine an SDK runs is its pin, sdks/engine-release.json.
[packages.typescript-sdk]
versioned_files = ["sdks/typescript/package.json", "sdks/typescript/package-lock.json"]
changelog = "sdks/typescript/CHANGELOG.md"

# knope has no reader for gradle.properties, so the version is the line that names it.
[packages.jvm-sdk]
versioned_files = [{ path = "sdks/jvm/gradle.properties", regex = "(?m)^version=(?<version>\\S+)$" }]
changelog = "sdks/jvm/CHANGELOG.md"

# Commit subjects here name plan items for maintainers (`feat: S0.1 plan grammar v1`). They are not
# read for a bump or for a changelog line.
[changes]
ignore_conventional_commits = true

# `knope document-change`: asks what kind of change this is and for a summary, and writes the file.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

# `knope prepare-release`: each package's version, its changelog and the consumed change files,
# staged and not committed. The first release of a package, and any other whose number is a decision
# rather than a sum, takes `--override-version <package>=<version>`.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

# Every member inherits the workspace's version, so Cargo.lock names each of them at the old one.
# knope's own Cargo.lock support follows a single crate; cargo knows them all, and touches nothing
# outside the workspace.
[[workflows.steps]]
type = "Command"
command = "cargo update --workspace"

# The benchmark harness is a workspace of its own that depends on this one's crates by path, so its
# lockfile names them at a version too. Left behind, the harness's next build rewrites it, and the
# Benchmarks workflow cannot switch branches to record its point (which is how 0.1.0 found this).
# CI's `checks` job fails a lockfile this list has missed.
[[workflows.steps]]
type = "Command"
command = "cargo update --manifest-path benchmarks/janus/Cargo.toml --workspace"

[[workflows.steps]]
type = "Command"
command = "git add Cargo.lock benchmarks/janus/Cargo.lock"
