[package]
name = "janus-csv"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "A Janus content component for text/csv, written against the published component interfaces only"

# Out of tree on purpose: this crate depends on nothing in the pact-janus workspace, only on the
# published WIT world and the schemas it describes. Its own workspace keeps the root one from
# adopting it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
csv = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.60"

[profile.release]
opt-level = "s"
lto = true
strip = true
