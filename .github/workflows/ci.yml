name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: WASM build (kernel)
        run: cargo build --package pact_janus_kernel --target wasm32-wasip2
      - name: Protocol schema lint
        run: cargo run --package pact_janus_schema_compat -- lint Documentation/specs/engine-protocol/schemas

  schema-compat:
    # Enforces the Engine Protocol's additive-evolution rules (spec §11.2):
    # any change to published schemas must pass `schema-compat diff` against
    # the base branch. A failure means the change is breaking — fix it, or
    # introduce a new protocol version directory (which this diff, keyed on
    # existing files, permits).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SCHEMAS: Documentation/specs/engine-protocol/schemas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Extract base-branch schemas
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p /tmp/base
          if git cat-file -e "origin/${{ github.base_ref }}:$SCHEMAS" 2>/dev/null; then
            git archive "origin/${{ github.base_ref }}" "$SCHEMAS" | tar -x -C /tmp/base
          fi
      - name: Diff schemas against base
        run: |
          if [ -d "/tmp/base/$SCHEMAS" ]; then
            cargo run --package pact_janus_schema_compat -- diff "/tmp/base/$SCHEMAS" "$SCHEMAS"
          else
            echo "No schemas on base branch; nothing to diff."
          fi
