name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Staged plan S0.2: every step is bash, so one script means the same thing on all three operating
# systems (on Windows that is Git for Windows' bash, which the runners ship).
defaults:
  run:
    shell: bash

jobs:
  checks:
    # The checks whose answer cannot depend on the operating system: they read the repository and
    # run nothing from it. Once is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Spec schema lint
        run: cargo run --package pact_janus_schema_compat -- lint Documentation/specs
      # Plan task 6.4: the conformance corpus against its own schema, and against the behavioural
      # specification's conformance ids — an id with no case is a hole in what "conformant" means.
      - name: Conformance corpus lint
        run: cargo run --package pact_janus_conformance -- lint
      # Staged plan S0.12: the ADRs, the specs and the plan cite each other and the prototype's
      # record by path, so a relative link that stops resolving — to a file, or to a heading in it —
      # fails here. Offline: links with a scheme are not fetched.
      - name: Documentation links resolve
        run: cargo run --package pact_janus_doc_links
      # Staged plan S0.4: a workspace outside this one that depends on its crates by path has a
      # lockfile naming them at a version, and a release moves that version. Nothing that builds
      # such a workspace passes --locked, so a stale lockfile is rewritten in place and found
      # later, as a dirty checkout, by whatever needed a clean one. Found here instead, on the pull
      # request that moved the version — `knope prepare-release` refreshes the ones knope.toml lists.
      - name: Lockfiles that name workspace crates are current
        run: |
          for lock in $(git ls-files '*/Cargo.lock'); do
            if grep -q '^name = "pact_janus_' "$lock"; then
              echo "$lock"
              cargo metadata --locked --format-version 1 --manifest-path "$(dirname "$lock")/Cargo.toml" > /dev/null
            fi
          done
      # S0.12's other exit: spikes/ keeps each spike's findings, and no code.
      - name: Spikes hold findings only
        run: |
          code="$(git ls-files -- spikes | grep -v '\.md$' || true)"
          if [ -n "$code" ]; then
            echo "$code"
            echo "::error::spikes/ holds findings only (staged plan S0.12); these files are not Markdown."
            exit 1
          fi

  rust:
    # Staged plan S0.2: the whole workspace on Linux, macOS and Windows. The subprocess is every
    # SDK's primary embedding (ADR 0023), so the engine has to be known to build, spawn and exit on
    # each of them, not assumed to.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      # The kernel embeds QuickJS for scripted hooks (ADR 0015), and `rquickjs`'s bindgen build —
      # the one that reaches the WASI targets — needs libclang. The only non-Rust build requirement
      # this workspace has, set up explicitly so a failure here reads as "the toolchain" rather
      # than as "the code". macOS finds the one Xcode ships.
      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      # Plan task 8.2: a real OCI registry for the component-distribution tests. They also run
      # against a registry in their own process, which can be told to lie; this one is the evidence
      # that a registry nobody here wrote agrees with the client. Linux only, because only Linux
      # runners run containers: on macOS and Windows the tests use the in-process registry alone.
      - name: OCI registry (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          for _ in $(seq 30); do
            curl -fsS http://localhost:5000/v2/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:5000/v2/ >/dev/null
          echo "JANUS_OCI_REGISTRY=localhost:5000" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      # Every test binary runs even after one fails, so a platform's failures arrive together
      # rather than one push at a time.
      - name: Test
        run: cargo test --no-fail-fast
      - name: WASM build (kernel)
        run: cargo build --package pact_janus_kernel --target wasm32-wasip2
      # Staged plan S0.4: the engine as a WASM component (engine/wasm) is a workspace member that is
      # empty on any target but wasm32, so the clippy step above saw nothing of it. Both of its
      # worlds are held to the same bar here: the one a release ships, and the benchmark harness's.
      # The tests above built the first and loaded it (engine/component-host/tests/engine_wasm.rs).
      - name: WASM engine component
        run: |
          cargo clippy --package pact_janus_engine_wasm --target wasm32-wasip2 -- -D warnings
          cargo clippy --package pact_janus_engine_wasm --features bench --target wasm32-wasip2 -- -D warnings
      # Plan task 8.1: the third-party CSV component is out of tree — its own workspace, depending
      # on nothing here — so the workspace steps above never see it. It is held to the same bar on
      # its own, and built for the target a component ships as; the engine's tests build it again
      # and load it.
      - name: Third-party component (janus-csv)
        working-directory: third-party/janus-csv
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --target wasm32-wasip2

  sdks:
    # Each SDK's own lint, tests and build, on Linux, macOS and Windows (staged plan S0.2). Both
    # suites drive a real janus-engine as a subprocess (plan task 6.2), which their test setup
    # builds — hence libclang, as in the rust job — so this is also where spawning the engine,
    # speaking frames over its stdio and its exit on stdin EOF are exercised on each system.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            sdks/typescript/package-lock.json
            demo/web-app/package-lock.json
            cli/tests/janus-engine-node/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install TypeScript SDK dependencies
        run: npm ci
        working-directory: sdks/typescript
      # Plan task 6.1: every SDK's generated bindings must be exactly what the pipeline produces
      # from the schemas today. A schema change without regenerated bindings — or a hand edit to a
      # generated file — fails here, not later as an SDK quietly disagreeing with the engine. What
      # the pipeline writes does not depend on where it runs, so it is checked in one place.
      - name: Regenerate bindings
        if: runner.os == 'Linux'
        run: cargo run --package pact_janus_bindings -- generate
      - name: Bindings match their schemas
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(git status --porcelain -- sdks)" ]; then
            git status --porcelain -- sdks
            git diff -- sdks | head -200
            echo "::error::Generated bindings differ from the schemas. Run 'cargo run -p pact_janus_bindings -- generate' and commit the result."
            exit 1
          fi
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: npm run lint && npm test && npm run build
      - name: JVM SDK
        working-directory: sdks/jvm
        run: ./gradlew build
      # Plan task 6.4, ADR 0017: each SDK's test run above also ran the shared conformance suite and
      # wrote its report. Conformance is that both accounted for every case in the corpus, and
      # passed it — the claim a build makes, rather than one a maintainer asserts. Made here on each
      # operating system, against the engine built on it.
      - name: SDKs are conformant
        run: cargo run --package pact_janus_conformance -- check target/conformance/typescript.json target/conformance/jvm.json
      # Plan task 6.5: "SDKs are thin" as an exit code. Every SDK source file must be classified into
      # a layer, and the hand-written layers must stay inside their budgets — so matching logic or
      # orchestration creeping back into an SDK shows up as a failing build, not as a stale number.
      - name: SDKs are thin
        run: cargo run --package pact_janus_thinness -- check
      # Plan task 4.5: the protocol-level client drives janus-engine frame by frame with no SDK in
      # the way — spawn, handshake, a consumer run through the mock, exit on stdin EOF. Spike 1.3
      # left exactly that open on Windows.
      - name: Protocol client (janus-engine over stdio)
        working-directory: cli/tests/janus-engine-node
        run: npm ci && npm test
      # Plan task 9.3: the demo is the RFC's whole loop, run end to end — consumer test, verification
      # with hooks, janus check, widening, fixing. --ci asserts every step's outcome, so a demo that no
      # longer shows what the report says it shows fails here. It is a bash walkthrough built on
      # symbolic links and job control, so it runs where those exist; on Windows the CLI, the engine
      # and the SDK it strings together are each covered by their own suites above.
      - name: Install the demo's dependencies
        if: runner.os != 'Windows'
        run: npm ci
        working-directory: demo/web-app
      - name: The demo runs
        if: runner.os != 'Windows'
        run: demo/run.sh --ci

  schema-compat:
    # Enforces the Engine Protocol's additive-evolution rules (spec §11.2) on
    # every schema any Phase 2 design ships — they all cross the same boundary,
    # so they all follow the same rules. Any change to published schemas must
    # pass `schema-compat diff` against the base branch. A failure means the
    # change is breaking — fix it, or introduce a new version directory (which
    # this diff, keyed on existing files, permits).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SCHEMAS: Documentation/specs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Extract base-branch schemas
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p /tmp/base
          if git cat-file -e "origin/${{ github.base_ref }}:$SCHEMAS" 2>/dev/null; then
            git archive "origin/${{ github.base_ref }}" "$SCHEMAS" | tar -x -C /tmp/base
          fi
      - name: Diff schemas against base
        run: |
          if [ -d "/tmp/base/$SCHEMAS" ]; then
            cargo run --package pact_janus_schema_compat -- diff "/tmp/base/$SCHEMAS" "$SCHEMAS"
          else
            echo "No schemas on base branch; nothing to diff."
          fi
