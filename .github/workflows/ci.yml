name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debug information in a debug build: most of a Windows target directory is its PDBs, so the
  # rust-cache entries fit the repository's 10 GB together, and Windows links faster. A panic still
  # says where it happened; only a backtrace loses its line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

# Staged plan S0.2: every step is bash, so one script means the same thing on all three operating
# systems (on Windows that is Git for Windows' bash, which the runners ship).
defaults:
  run:
    shell: bash

jobs:
  checks:
    # The checks whose answer cannot depend on the operating system: they read the repository and
    # run nothing from it. Once is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: a pull request restores main's, and its own would push
          # main's out of the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Spec schema lint
        run: cargo run --package pact_janus_schema_compat -- lint Documentation/specs
      # Plan task 6.4: the conformance corpus against its own schema, and against the behavioural
      # specification's conformance ids — an id with no case is a hole in what "conformant" means.
      - name: Conformance corpus lint
        run: cargo run --package pact_janus_conformance -- lint
      # Staged plan S0.12: the ADRs, the specs and the plan cite each other and the prototype's
      # record by path, so a relative link that stops resolving — to a file, or to a heading in it —
      # fails here. Offline: links with a scheme are not fetched.
      - name: Documentation links resolve
        run: cargo run --package pact_janus_doc_links
      # Staged plan S0.4: a workspace outside this one that depends on its crates by path has a
      # lockfile naming them at a version, and a release moves that version. Nothing that builds
      # such a workspace passes --locked, so a stale lockfile is rewritten in place and found
      # later, as a dirty checkout, by whatever needed a clean one. Found here instead, on the pull
      # request that moved the version — `knope prepare-release` refreshes the ones knope.toml lists.
      - name: Lockfiles that name workspace crates are current
        run: |
          for lock in $(git ls-files '*/Cargo.lock'); do
            if grep -q '^name = "pact_janus_' "$lock"; then
              echo "$lock"
              cargo metadata --locked --format-version 1 --manifest-path "$(dirname "$lock")/Cargo.toml" > /dev/null
            fi
          done
      # Plan task 6.5: "SDKs are thin" as an exit code. Every SDK source file must be classified into
      # a layer, and the hand-written layers must stay inside their budgets — so matching logic or
      # orchestration creeping back into an SDK shows up as a failing build, not as a stale number.
      - name: SDKs are thin
        run: cargo run --package pact_janus_thinness -- check
      # S0.12's other exit: spikes/ keeps each spike's findings, and no code.
      - name: Spikes hold findings only
        run: |
          code="$(git ls-files -- spikes | grep -v '\.md$' || true)"
          if [ -n "$code" ]; then
            echo "$code"
            echo "::error::spikes/ holds findings only (staged plan S0.12); these files are not Markdown."
            exit 1
          fi

  rust:
    # Staged plan S0.2: the whole workspace on Linux, macOS and Windows. The subprocess is every
    # SDK's primary embedding (ADR 0023), so the engine has to be known to build, spawn and exit on
    # each of them, not assumed to.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The kernel embeds QuickJS for scripted hooks (ADR 0015), and `rquickjs`'s bindgen build —
      # the one that reaches the WASI targets — needs libclang. The only non-Rust build requirement
      # this workspace has, set up explicitly so a failure here reads as "the toolchain" rather
      # than as "the code". macOS finds the one Xcode ships.
      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      # Plan task 8.2: a real OCI registry for the component-distribution tests. They also run
      # against a registry in their own process, which can be told to lie; this one is the evidence
      # that a registry nobody here wrote agrees with the client. Linux only, because only Linux
      # runners run containers: on macOS and Windows the tests use the in-process registry alone.
      - name: OCI registry (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          for _ in $(seq 30); do
            curl -fsS http://localhost:5000/v2/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:5000/v2/ >/dev/null
          echo "JANUS_OCI_REGISTRY=localhost:5000" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      # Every test binary runs even after one fails, so a platform's failures arrive together
      # rather than one push at a time.
      - name: Test
        run: cargo test --no-fail-fast
      - name: WASM build (kernel)
        run: cargo build --package pact_janus_kernel --target wasm32-wasip2
      # Staged plan S0.4: the engine as a WASM component (engine/wasm) is a workspace member that is
      # empty on any target but wasm32, so the clippy step above saw nothing of it. Both of its
      # worlds are held to the same bar here: the one a release ships, and the benchmark harness's.
      # The tests above built the first and loaded it (engine/component-host/tests/engine_wasm.rs).
      - name: WASM engine component
        run: |
          cargo clippy --package pact_janus_engine_wasm --target wasm32-wasip2 -- -D warnings
          cargo clippy --package pact_janus_engine_wasm --features bench --target wasm32-wasip2 -- -D warnings
      # Plan task 8.1: the third-party CSV component is out of tree — its own workspace, depending
      # on nothing here — so the workspace steps above never see it. It is held to the same bar on
      # its own, and built for the target a component ships as; the engine's tests build it again
      # and load it.
      - name: Third-party component (janus-csv)
        working-directory: third-party/janus-csv
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --target wasm32-wasip2

  verifier-diff:
    # Staged plan S1.1: today's verifier (pact_verifier_cli, pinned in
    # tools/verifier-diff/pact-verifier.json) and janus verify, on every pact in corpora/verifier/
    # against the same provider, compared interaction by interaction. It fails on a disagreement the
    # ledger (corpora/verifier/disagreements.json) does not list, and on a listed one that has gone.
    # The broker cases (S1.3) publish their pacts to the Pact Broker pinned in
    # tools/verifier-diff/pact-broker.json and fetch them from it.
    # Linux only: the pin names one asset, the broker is a container, and the comparison does not
    # depend on the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Today's verifier, at the pinned version
        run: echo "PACT_VERIFIER_CLI=$(.github/scripts/pact-verifier.sh "$RUNNER_TEMP/pact-verifier")" >> "$GITHUB_ENV"
      - name: The Pact Broker, at the pinned version
        run: echo "VERIFIER_DIFF_BROKER=$(.github/scripts/pact-broker.sh start)" >> "$GITHUB_ENV"
      - name: Build janus
        run: cargo build --package pact_janus_cli --bin janus
      - name: Compare
        run: cargo run --package pact_janus_verifier_diff -- run --json target/verifier-diff.json
      - name: Publish to the broker, and verify from it
        # `janus publish` a pact and a Janus contract, then `janus verify --broker-url` over what the
        # broker serves back (S1.3); and both behind basic auth and a bearer token, at trace, failing
        # if a credential appears in anything printed. The same tests skip wherever
        # JANUS_PACT_BROKER is unset.
        run: cargo test --package pact_janus_cli --test cli -- broker
        env:
          JANUS_PACT_BROKER: ${{ env.VERIFIER_DIFF_BROKER }}
      - name: The broker client's own pact, verified by the broker
        # The client's consumer pact with the Pact Broker (S1.3's third layer), written by
        # engine/broker-client/tests/pact.rs everywhere and verified here, by today's verifier, against
        # the pinned broker, with each provider state set up through the broker's API.
        run: cargo test --package pact_janus_broker_client --test pact -- --nocapture
        env:
          JANUS_PACT_BROKER: ${{ env.VERIFIER_DIFF_BROKER }}
      - name: The broker client's recording, made again
        # Every other job replays engine/broker-client/tests/recorded/pact-broker.json offline (S1.3's
        # second layer). Here it is recorded again from the pinned broker, and any difference fails:
        # record it with the same command and commit the result.
        run: |
          cargo test --package pact_janus_broker_client --test recorded
          git diff --exit-code -- engine/broker-client/tests/recorded
        env:
          JANUS_PACT_BROKER: ${{ env.VERIFIER_DIFF_BROKER }}
          RECORDINGS: overwrite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-diff
          path: target/verifier-diff.json
          if-no-files-found: ignore

  engine:
    # What the SDK suites below drive, built from this tree on each operating system and handed to
    # them as a file, so that they need no Rust toolchain (staged plan S0.10). Linux also builds the
    # third-party CSV component one TypeScript test loads; a WASM component is the same file on
    # every host.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: engine
          workspaces: |
            .
            third-party/janus-csv
      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - name: Build janus-engine
        run: |
          cargo build --locked --package pact_janus_cli --bin janus-engine
          mkdir -p dist
          cp target/debug/janus-engine${{ runner.os == 'Windows' && '.exe' || '' }} dist/
      - name: Build the CSV component
        if: runner.os == 'Linux'
        working-directory: third-party/janus-csv
        run: cargo build --locked --release --target wasm32-wasip2
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: janus-csv
          path: third-party/janus-csv/target/wasm32-wasip2/release/janus_csv.wasm
          if-no-files-found: error

  sdks:
    # Each SDK's own lint, tests and build, on Linux, macOS and Windows (staged plan S0.2), with no
    # Rust toolchain reachable (S0.10): an SDK contributor needs Node or a JDK and an engine, and
    # nothing else. The runners ship one, so the suites run through without-rust.sh, which leaves it
    # off PATH and shows that cargo no longer runs; a step that still reaches for it fails. The engine is this tree's, from the job above, since an SDK change here may need
    # an engine change in the same pull request; the pinned release is resolved instead after each
    # release (release.yml). Both suites drive it as a subprocess (plan task 6.2), so this is also
    # where spawning the engine, speaking frames over its stdio and its exit on stdin EOF are
    # exercised on each system.
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: ${{ runner.temp }}/engine
      - uses: actions/download-artifact@v4
        with:
          name: janus-csv
          path: ${{ runner.temp }}/janus-csv
      # An artifact does not keep the executable bit.
      - name: The engine under test
        run: |
          engine="$RUNNER_TEMP/engine/janus-engine${{ runner.os == 'Windows' && '.exe' || '' }}"
          chmod +x "$engine"
          echo "JANUS_ENGINE=$engine" >> "$GITHUB_ENV"
          echo "JANUS_CSV_COMPONENT=$RUNNER_TEMP/janus-csv/janus_csv.wasm" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: ../../.github/scripts/without-rust.sh bash -c 'npm ci && npm run lint && npm test && npm run build'
      - name: JVM SDK
        working-directory: sdks/jvm
        run: ../../.github/scripts/without-rust.sh ./gradlew build
      # Each suite above also ran the shared conformance suite and wrote its report (plan task 6.4).
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ runner.os }}
          path: target/conformance/
          if-no-files-found: error

  conformant:
    # Plan task 6.4, ADR 0017: conformance is that both SDKs accounted for every case in the corpus,
    # and passed it — the claim a build makes, rather than one a maintainer asserts. Decided for
    # each operating system's pair of reports, each made against the engine built on that system.
    needs: sdks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: reports
      - name: SDKs are conformant
        run: |
          for os in Linux macOS Windows; do
            echo "== $os"
            cargo run --package pact_janus_conformance -- check "reports/conformance-$os/typescript.json" "reports/conformance-$os/jvm.json"
          done

  sdk-tooling:
    # What around the SDKs still needs the workspace: the binding pipeline, the protocol-level
    # client, and the demo, which builds the CLI and the sample provider.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # wasm32-wasip2 for the CSV component, which the protocol client's explain test declares
      # (staged plan S1.12).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            sdks/typescript/package-lock.json
            demo/web-app/package-lock.json
            cli/tests/janus-engine-node/package-lock.json
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
      # Plan task 6.1: every SDK's generated bindings must be exactly what the pipeline produces
      # from the schemas today. A schema change without regenerated bindings — or a hand edit to a
      # generated file — fails here, not later as an SDK quietly disagreeing with the engine. What
      # the pipeline writes does not depend on where it runs, so it is checked in one place.
      - name: Install TypeScript SDK dependencies
        if: runner.os == 'Linux'
        run: npm ci
        working-directory: sdks/typescript
      - name: Regenerate bindings
        if: runner.os == 'Linux'
        run: cargo run --package pact_janus_bindings -- generate
      - name: Bindings match their schemas
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(git status --porcelain -- sdks)" ]; then
            git status --porcelain -- sdks
            git diff -- sdks | head -200
            echo "::error::Generated bindings differ from the schemas. Run 'cargo run -p pact_janus_bindings -- generate' and commit the result."
            exit 1
          fi
      # Plan task 4.5: the protocol-level client drives janus-engine frame by frame with no SDK in
      # the way — spawn, handshake, a consumer run through the mock, exit on stdin EOF. Spike 1.3
      # left exactly that open on Windows. Its setup asks cargo for the engine, within a test hook's
      # time limit, so the engine is built first: a cold build does not fit.
      - name: Build janus-engine
        run: cargo build --package pact_janus_cli --bin janus-engine
      - name: Build the CSV component
        working-directory: third-party/janus-csv
        run: cargo build --release --target wasm32-wasip2
      - name: Protocol client (janus-engine over stdio)
        working-directory: cli/tests/janus-engine-node
        run: npm ci && npm test
      # Plan task 9.3: the demo is the RFC's whole loop, run end to end — consumer test, verification
      # with hooks, janus check, widening, fixing. --ci asserts every step's outcome, so a demo that no
      # longer shows what the report says it shows fails here. It is a bash walkthrough built on
      # symbolic links and job control, so it runs where those exist; on Windows the CLI, the engine
      # and the SDK it strings together are each covered by their own suites above.
      - name: Install the demo's dependencies
        if: runner.os != 'Windows'
        run: npm ci
        working-directory: demo/web-app
      - name: The demo runs
        if: runner.os != 'Windows'
        run: demo/run.sh --ci

  schema-compat:
    # Enforces the Engine Protocol's additive-evolution rules (spec §11.2) on
    # every schema any Phase 2 design ships — they all cross the same boundary,
    # so they all follow the same rules. Any change to published schemas must
    # pass `schema-compat diff` against the base branch. A failure means the
    # change is breaking — fix it, or introduce a new version directory (which
    # this diff, keyed on existing files, permits).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SCHEMAS: Documentation/specs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Extract base-branch schemas
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p /tmp/base
          if git cat-file -e "origin/${{ github.base_ref }}:$SCHEMAS" 2>/dev/null; then
            git archive "origin/${{ github.base_ref }}" "$SCHEMAS" | tar -x -C /tmp/base
          fi
      - name: Diff schemas against base
        run: |
          if [ -d "/tmp/base/$SCHEMAS" ]; then
            cargo run --package pact_janus_schema_compat -- diff "/tmp/base/$SCHEMAS" "$SCHEMAS"
          else
            echo "No schemas on base branch; nothing to diff."
          fi
