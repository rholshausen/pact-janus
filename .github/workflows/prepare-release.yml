name: Prepare release

# Staged plan S0.4, ADR 0028: the first half of a release, run by hand. knope turns the change files
# gathered in .changeset/ into the next version of each package they name — the engine, and since
# S1.36 each SDK (ADR 0060) — and its changelog entry, and this pushes the result as the `release`
# branch. A maintainer opens the pull request from it — so that CI runs on
# it, which it would not for a pull request a workflow's own token opened — and merging that pull
# request is what releases (release.yml).
#
# The same thing by hand: `knope prepare-release` on a branch, commit, push, open the pull request.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: >-
          The versions to release, where one is a decision rather than the sum of the change files,
          as `<package>=<version>` separated by spaces (an SDK's first release is
          `typescript-sdk=0.1.0`). Empty: what the change files add up to.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # To push the `release` branch. It cannot push to main, and opens no pull request.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # knope reads the tags for the last release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # knope-dev/action v2.1.2, pinned by commit because this job's token can write.
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675
        with:
          version: 0.23.0
      - name: Version, changelog and lockfile
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          versions() {
            echo "engine=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pact_janus_kernel") | .version')"
            echo "typescript-sdk=$(jq -r .version sdks/typescript/package.json)"
            echo "jvm-sdk=$(sed -n 's/^version=//p' sdks/jvm/gradle.properties)"
          }
          versions > "$RUNNER_TEMP/before"
          git switch -c release
          overrides=()
          for version in $VERSIONS; do
            overrides+=(--override-version "$version")
          done
          knope prepare-release "${overrides[@]}"
          # What moved, as `engine 0.5.0, typescript-sdk 0.1.0`: the commit's subject and the summary's.
          versions | grep -vxFf "$RUNNER_TEMP/before" | sed 's/=/ /' | paste -sd, - | sed 's/,/, /g' > "$RUNNER_TEMP/released"
      - name: Push the release branch
        run: |
          released="$(cat "$RUNNER_TEMP/released")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $released"
          # Forced: an unmerged `release` branch from an earlier run is replaced, not built upon.
          git push --force origin release
          title="$(jq -rn --arg t "chore: release $released" '$t | @uri')"
          {
            echo "### Release $released is prepared"
            echo
            echo "[Open the pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release?expand=1&title=$title). Merging it publishes each release: release.yml the engine's, release-sdks.yml each SDK's."
          } >> "$GITHUB_STEP_SUMMARY"
