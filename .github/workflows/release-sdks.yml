name: Release SDKs

# Staged plan S1.36, ADR 0060: what an SDK's release is, as a build. Until the SDKs graduate (S2.9),
# each is released from here as files on a GitHub release of its own, tagged `<package>/v<version>`:
# the TypeScript SDK as the tarball `npm pack` writes, installed by its URL; the JVM SDK as each
# module's jar, sources jar, Ivy descriptor and POM, which Gradle reads in place through an `ivy`
# repository. Neither carries the engine: an SDK fetches the one its pin names on first use.
#
# As for the engine (release.yml, ADR 0028), a release is a version with no tag yet — in
# sdks/typescript/package.json or sdks/jvm/gradle.properties, written there by `knope prepare-release`
# from the change files naming the SDK — and merging the pull request that holds it is the decision
# to release. Each SDK whose version has no tag is built, its suite run against its pinned engine
# with no Rust toolchain, and what is about to be published installed into a project outside the
# repository (sdks/<sdk>/release-check), which runs a consumer and a provider test with nothing
# naming an engine, on each operating system an engine is released for. Only then is it tagged and
# published, in one step, with every file attested. Each SDK's release is release-sdk.yml, called once
# for each SDK, so one that fails stops only its own.
#
# An SDK is released against the engine this tree is at. When a release pull request also releases
# the engine, the engine's version in Cargo.toml has moved past the SDKs' pin, and the SDKs wait: the
# pin for the new engine comes in the pull request release.yml proposes once the engine is published,
# and merging that is the push that releases them, against it.
#
# Everything short of publishing also runs on a pull request that could break it, and on demand.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release-sdks.yml
      - .github/workflows/release-sdk.yml
      - sdks/engine-release.json
      - sdks/typescript/package.json
      - sdks/typescript/package-lock.json
      - sdks/typescript/src/engine/**
      - sdks/typescript/release-check/**
      - sdks/jvm/build.gradle.kts
      - sdks/jvm/gradle.properties
      - sdks/jvm/sdk/build.gradle.kts
      - sdks/jvm/sdk/src/main/java/io/pact/janus/sdk/engine/**
      - sdks/jvm/release-check/**
  workflow_dispatch:

permissions:
  contents: read

# One at a time on a branch: two runs must not both decide the same version is theirs to tag.
concurrency:
  group: release-sdks-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    # What this run is, for each SDK: a release, a rehearsal, a release waiting for its pin, or — most
    # pushes to main — nothing. Each output is the SDK's inputs to release-sdk.yml, or empty.
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.plan.outputs.typescript }}
      jvm: ${{ steps.plan.outputs.jvm }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          engine="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          pinned="$(jq -r .version sdks/engine-release.json)"
          for sdk in typescript jvm; do
            if [ "$sdk" = typescript ]; then
              version="$(jq -r .version sdks/typescript/package.json)"
              title="TypeScript SDK"
            else
              version="$(sed -n 's/^version=//p' sdks/jvm/gradle.properties)"
              title="JVM SDK"
            fi
            if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' <<<"$version"; then
              echo "::error::The $title has no version this can read: '$version'"
              exit 1
            fi
            tag="$sdk-sdk/v$version"

            # 0.0.0 is the version of an SDK nothing has been released from.
            released=false
            if [ "$version" = 0.0.0 ] || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              released=true
            fi
            # A version to release, in a tree whose engine is ahead of the pin: it is released by the
            # pull request that pins this engine, and built against that pin, so it is not built
            # against the old one here, on main or as a rehearsal of the release pull request.
            if [ "$released" = false ] && [ "$engine" != "$pinned" ]; then
              echo "$title $version waits: the engine is at $engine and the SDKs pin $pinned. Merging the pull request that pins $engine releases it." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            publish=false
            if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              if [ "$released" = true ]; then
                echo "$tag is already released, or nothing is."
              else
                publish=true
              fi
            fi
            # A push to main with nothing to release builds nothing. Anything else is a rehearsal.
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$publish" = false ]; then
              echo "$title $version — nothing to build" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "$title $version — build, publish: $publish" >> "$GITHUB_STEP_SUMMARY"
            echo "$sdk=$(jq -cn --arg sdk "$sdk" --arg title "$title" --arg version "$version" --arg tag "$tag" \
              --argjson publish "$publish" '{sdk: $sdk, title: $title, version: $version, tag: $tag, publish: $publish}')" >> "$GITHUB_OUTPUT"
          done

  typescript:
    needs: plan
    if: needs.plan.outputs.typescript != ''
    # What publish needs, which a called workflow's jobs can have no more of than this.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-sdk.yml
    with:
      sdk: ${{ fromJSON(needs.plan.outputs.typescript).sdk }}
      title: ${{ fromJSON(needs.plan.outputs.typescript).title }}
      version: ${{ fromJSON(needs.plan.outputs.typescript).version }}
      tag: ${{ fromJSON(needs.plan.outputs.typescript).tag }}
      publish: ${{ fromJSON(needs.plan.outputs.typescript).publish }}

  jvm:
    needs: plan
    if: needs.plan.outputs.jvm != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-sdk.yml
    with:
      sdk: ${{ fromJSON(needs.plan.outputs.jvm).sdk }}
      title: ${{ fromJSON(needs.plan.outputs.jvm).title }}
      version: ${{ fromJSON(needs.plan.outputs.jvm).version }}
      tag: ${{ fromJSON(needs.plan.outputs.jvm).tag }}
      publish: ${{ fromJSON(needs.plan.outputs.jvm).publish }}
