[package]
name = "pact_janus_cli"
description = "Pact Janus CLI: verify, explain, upgrade, check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "janus"
path = "src/main.rs"

[[bin]]
# ADR 0003's subprocess artifact: the real kernel behind spike 1.3's proven stdio framing
# (plan task 4.5). A separate binary target, not a `janus` subcommand — an SDK embedding spawns
# this directly and never sees `janus`'s own CLI surface.
name = "janus-engine"
path = "src/bin/janus_engine.rs"

[dependencies]
pact_janus_kernel = { path = "../engine/kernel" }
pact_janus_component_http = { path = "../engine/component-http" }
pact_janus_component_json = { path = "../engine/component-json" }
serde_json = "1"

[lints]
workspace = true
