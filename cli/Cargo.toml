[package]
name = "pact_janus_cli"
description = "Pact Janus CLI: verify, explain, upgrade, check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The commands live in the library, so both binaries and the tests share one build of them.
[lib]
path = "src/lib.rs"

[[bin]]
name = "janus"
path = "src/main.rs"

[[bin]]
# ADR 0003's subprocess artifact: the real kernel behind spike 1.3's proven stdio framing
# (plan task 4.5). A separate binary target, not a `janus` subcommand — an SDK embedding spawns
# this directly and never sees `janus`'s own CLI surface.
name = "janus-engine"
path = "src/bin/janus_engine.rs"

[dependencies]
pact_janus_kernel = { path = "../engine/kernel" }
pact_janus_component_http = { path = "../engine/component-http" }
pact_janus_component_json = { path = "../engine/component-json" }
pact_janus_component_text = { path = "../engine/component-text" }
pact_janus_component_form = { path = "../engine/component-form" }
pact_janus_component_xml = { path = "../engine/component-xml" }
pact_janus_component_multipart = { path = "../engine/component-multipart" }
# The capabilities the kernel deliberately lacks (lifecycle-hooks spec §8.5, ADR 0013): a
# filesystem for `verifier.janus.yaml`, a process for `exec` hooks, a socket for `http` ones.
pact_janus_hooks_host = { path = "../engine/hooks-host" }
pact_janus_component_oauth2 = { path = "../engine/component-oauth2" }
# The WASM loader (plan task 8.1): out-of-tree components a project declares, hosted by the native
# embeddings — both `janus` and `janus-engine` — and by nothing else (ADR 0013).
pact_janus_component_host = { path = "../engine/component-host" }
# The Pact Broker client (ADR 0032, staged plan S1.3): a native host capability, registered by both
# native binaries, so a `broker` source and `publish` work through `janus` and every SDK alike.
pact_janus_broker_client = { path = "../engine/broker-client" }
serde_json = "1"
# `--transports` entries are on the provider URL's host (staged plan S1.7). Already in the tree
# behind `pact_janus_hooks_host`.
url = "2"
# A policy document is authored by a person (design 2.8 §7.1's project layer), so it is YAML or
# JSON — the same choice the hook loader makes for `verifier.janus.yaml`, and the same crate,
# already in the tree behind `pact_janus_hooks_host`.
serde_yaml_ng = "0.10"
# The CLI is where the kernel's `tracing` facade actually goes somewhere (AGENTS.md: "a subscriber
# is an application concern, installed by whatever embeds the kernel"). `janus-engine` installs it
# so `RUST_LOG=trace` shows the frames `Engine::dispatch` traces on every call.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The command line (src/args.rs): flags, help, usage errors and their exit code, from one
# declaration. clap_complete turns the same declaration into `janus completions <shell>`.
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
# Colour for the plans `explain` and `--explain-failures` print (src/highlight.rs, plan-grammar
# spec §3.3). anstream decides where it belongs — a terminal, unless NO_COLOR; anywhere, with
# CLICOLOR_FORCE — and strips it everywhere else. Both already in the tree behind clap.
anstream = "1"
anstyle = "1"

[dev-dependencies]
# A real provider on a real socket for the CLI's own tests: `janus verify` is only worth testing
# against something that can actually answer, and the one the plan calls for is in this repo.
pact_janus_sample_order_service = { path = "../samples/order-service" }
# The in-process OCI registry `janus component push` pushes to and `janus verify` pulls from (plan
# task 8.2) — the component host's own test registry, included by path. Both already in the tree.
tiny_http = "0.12"
sha2 = "0.10"
# The authenticating door the credential tests put in front of the Pact Broker (staged plan S1.3):
# it forwards with ureq, and checks a basic credential's encoding. Both already in the tree.
ureq = "3"
base64 = "0.22"
# A TLS provider that demands a client certificate, the authority that issues it, and a proxy
# (staged plan S1.5's exit). Test-only.
pact_janus_test_servers = { path = "../tools/test-servers" }
# Snapshot tests of the command surface: trycmd runs the cases under tests/cmd/ (help, usage errors,
# exit codes, offline commands), and snapbox compares whole outputs inside tests/cli.rs, where a
# case needs a provider or a registry running first.
trycmd = "1.2"
snapbox = "1.2"
rstest = "0.26"
pretty_assertions = "1"

[lints]
workspace = true
