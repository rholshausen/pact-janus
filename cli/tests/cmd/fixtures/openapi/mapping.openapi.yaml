# One operation per construct `janus derive` maps (ADR 0088 decision 5, spike 7.3 §3), exact or lossy,
# so the derived shape and its losses have something to point at for each. Spike 7.3's
# mapping-gaps document, with what the real build added.
openapi: 3.1.0
info:
  title: mapping-service
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
  - url: https://{region}.example.com/v1/
    variables:
      region:
        default: au
paths:
  /discriminated:
    get:
      responses:
        "200":
          description: a payment method, told apart by its type
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Card"
                  - $ref: "#/components/schemas/Invoice"
                discriminator:
                  propertyName: type
                  mapping:
                    card: "#/components/schemas/Card"
  /undiscriminated:
    get:
      responses:
        "200":
          description: either, with nothing to tell them apart
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Card"
                  - $ref: "#/components/schemas/Invoice"
  /composed:
    get:
      responses:
        "200":
          description: a card with a region
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Card"
                  - type: object
                    required: [region]
                    properties:
                      region:
                        type: string
                        enum: [AU, NZ]
  /scalars:
    get:
      responses:
        "200":
          description: each scalar mapping
          content:
            application/json:
              schema:
                type: object
                required: [kind, maybe, either, level, id, code, reference, count, ratio, flag, when, tags]
                properties:
                  kind:
                    const: scalar
                  maybe:
                    type: [string, "null"]
                  either:
                    anyOf:
                      - type: string
                      - type: "null"
                  level:
                    type: string
                    enum: [low, high, null]
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                    pattern: "^[A-Z]{3}$"
                    example: AUD
                  reference:
                    type: string
                    pattern: "^(?=REF)"
                  count:
                    type: integer
                    minimum: 0
                  ratio:
                    type: number
                  flag:
                    type: boolean
                  when:
                    type: string
                    format: date
                  tags:
                    type: array
                    minItems: 1
                    maxItems: 5
                    items:
                      type: string
                  secret:
                    type: string
                    writeOnly: true
  /objects:
    get:
      responses:
        "200":
          description: open, closed and map-like objects
          content:
            application/json:
              schema:
                type: object
                required: [closed, labels, extended, untyped, anything]
                properties:
                  closed:
                    type: object
                    additionalProperties: false
                    required: [id]
                    properties:
                      id:
                        type: string
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                  extended:
                    type: object
                    additionalProperties:
                      type: integer
                    properties:
                      name:
                        type: string
                  untyped:
                    type: object
                  anything: {}
  /references:
    get:
      responses:
        "200":
          description: a tree, and a schema in another document
          content:
            application/json:
              schema:
                type: object
                required: [tree]
                properties:
                  tree:
                    $ref: "#/components/schemas/Node"
                  elsewhere:
                    $ref: "common.yaml#/Money"
  /outcomes/{id}:
    get:
      responses:
        "200":
          description: found
          headers:
            X-Rate-Limit:
              required: true
              schema:
                type: integer
            ETag:
              schema:
                type: string
          content:
            application/problem+json; charset=utf-8:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
        4XX:
          description: any other client error
        default:
          description: anything else
  /no-json:
    servers:
      - url: https://files.example.com/v1
      - url: https://files.example.com/v2
    get:
      responses:
        "200":
          description: a CSV export
          content:
            text/csv:
              schema:
                type: string
components:
  responses:
    NotFound:
      description: no such thing
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                const: not-found
  schemas:
    Card:
      type: object
      required: [type, last4]
      properties:
        type:
          type: string
        last4:
          type: string
          pattern: "[0-9]{4}"
    Invoice:
      type: object
      required: [type, dueDate]
      properties:
        type:
          type: string
        dueDate:
          type: string
          format: date
    Node:
      type: object
      required: [name]
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
