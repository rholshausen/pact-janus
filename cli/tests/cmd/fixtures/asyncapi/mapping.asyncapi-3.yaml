# One operation per AsyncAPI 3.0 construct janus derive maps (staged plan S4.8, ADR 0091), each named
# for what it shows. The schema mapping is OpenAPI's, which mapping.openapi.yaml covers. This document
# names no defaultContentType, so a message that names no contentType is read as JSON, and says so.
asyncapi: 3.0.0
info:
  title: mapping
  version: 1.0.0
channels:
  events:
    address: events
    messages:
      shipped:
        $ref: '#/components/messages/Shipped'
      cancelled:
        $ref: '#/components/messages/Cancelled'
      untyped:
        name: Untyped
        contentType: application/json
      avro:
        name: AvroEvent
        contentType: application/avro
        payload:
          schemaFormat: application/vnd.apache.avro+json;version=1.9.0
          schema:
            type: record
            name: AvroEvent
            fields:
              - name: id
                type: string
      text:
        name: TextEvent
        contentType: text/plain
        payload:
          type: string
  audit:
    address: 'audit.{region}'
    parameters:
      region:
        description: Where the event happened.
    messages:
      audited:
        name: Audited
        payload:
          type: object
          properties:
            at:
              type: string
              format: date-time
  # The same message on a second channel: a consumer's message carries nothing that says which.
  eventsCopy:
    address: events.copy
    messages:
      shipped:
        $ref: '#/components/messages/Shipped'
  lookups:
    address: lookups
    messages:
      lookup:
        $ref: '#/components/messages/Lookup'
operations:
  # Every message of the channel, since the operation lists none: each fixes its own `kind`.
  sendEvents:
    action: send
    channel:
      $ref: '#/channels/events'
  # A message that fixes nothing selects nothing, and is matched only by its description.
  sendAudit:
    action: send
    channel:
      $ref: '#/channels/audit'
  sendCopies:
    action: send
    channel:
      $ref: '#/channels/eventsCopy'
  # A reply whose channel has no messages, and that lists none: nothing to derive.
  answerLookupNowhere:
    action: receive
    channel:
      $ref: '#/channels/lookups'
    reply:
      address:
        location: '$message.header#/replyTo'
  # A message the document does not hold.
  sendMissing:
    action: send
    channel:
      $ref: '#/channels/events'
    messages:
      - $ref: '#/components/messages/Missing'
  # What the application receives, and a request it makes: the other sides' shapes, not derived.
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/events'
  askLookup:
    action: send
    channel:
      $ref: '#/channels/lookups'
    reply:
      channel:
        $ref: '#/channels/events'
components:
  messages:
    Shipped:
      name: Shipped
      traits:
        - $ref: '#/components/messageTraits/Json'
      # The message's own contentType wins over its trait's in AsyncAPI 3.0.
      contentType: application/json
      headers:
        type: object
        properties:
          kind:
            type: string
            enum: [shipped]
      payload:
        $ref: '#/components/schemas/Shipment'
    Cancelled:
      name: Cancelled
      contentType: application/json
      headers:
        type: object
        properties:
          kind:
            type: string
            const: cancelled
      payload:
        type: object
        required: [reason]
        properties:
          reason:
            type: string
    Lookup:
      name: Lookup
      contentType: application/json
      payload:
        type: object
  messageTraits:
    Json:
      contentType: application/vnd.example+json
      headers:
        type: object
        properties:
          source:
            type: string
  schemas:
    Shipment:
      type: object
      required: [parcel]
      properties:
        parcel:
          oneOf:
            - $ref: '#/components/schemas/Letter'
            - $ref: '#/components/schemas/Box'
          # AsyncAPI's discriminator is the property's name, and each alternative's value its
          # schema's name.
          discriminator: type
    Letter:
      type: object
      required: [type]
      properties:
        type:
          type: string
    Box:
      type: object
      required: [type, weight]
      properties:
        type:
          type: string
        weight:
          type: number
